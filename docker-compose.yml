version: "3.8"
services:
  thaimui-pms-api:
    build: .
    platform: linux/amd64
    image: registry.gitlab.com/jostechnology/thaimui-pms-api-dev:test
    container_name: thaimui-pms-api
    restart: always
    network_mode: bridge

    ports:
      - 5000:5000
    environment:
      - connection_string=${connection_string}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}

    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "/usr/share/zoneinfo:/usr/share/zoneinfo:ro"
